<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>202026</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#262626">

<!-- PWA / iPhone Icons -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="mask-icon" href="favicon.png" color="#11DA2D">

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="202026">

<style>
@font-face {
  font-family: "Bipolar";
  src: url("Bipolar.ttf") format("truetype");
  font-weight: normal;
  font-style: normal;
}

/* ---------------- GLOBAL ---------------- */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: "Bipolar", system-ui, sans-serif;
  color: #11DA2D;

  /* Background image */
  background: url("background.jpg") no-repeat center center fixed;
  background-size: cover;
  position: relative;

  /* fallback color for transparent status bar */
  background-color: #7A8CA4;
}


/* Dark overlay */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: -1;
}

.app {
  min-height: 100vh;
  padding: 80px 42px 120px;
}

/* HEADER */
.header {
  text-align: center;
  font-size: 28px;
  letter-spacing: 2px;
  margin-bottom: 50px;
  font-weight: bold;
}

/* SECTIONS */
.section { margin-bottom: 60px; }
.title {
  font-size: 20px;
  letter-spacing: 4px;
  margin-bottom: 15px;
}

/* BARS */
.bar-wrap {
  height: 14px;
  background: rgba(255,255,255,0.15); /* transparent */
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}
.bar-fill { height: 100%; border-radius: 8px 0 0 8px; }
.day, .month, .year, .life { background: #11DA2D; }

/* META */
.meta {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 2px;
  margin-top: 10px;
  opacity: 0.8;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  text-transform: capitalize;
}
.modal-content {
  background: rgba(30,30,30,0.8);
  width: 90%;
  max-width: 420px;
  max-height: 50vh;
  padding: 22px;
  border-radius: 14px;
  overflow-y: auto;
  overflow-x: hidden;
  word-wrap: break-word;
  white-space: normal;
}
.modal h2 { margin-top:0; letter-spacing: 4px; }

/* TASKS */
.task {
  padding: 10px 0;
  border-bottom: 1px solid #333;
  cursor: pointer;
  word-wrap: break-word;
  white-space: normal;
}
.task.done { text-decoration: line-through; opacity: 0.35; }
.task-actions { float: right; color: #777; cursor: pointer; }

input, button {
  font-family: "Bipolar", system-ui, sans-serif;
  font-size: 14px;
}

input {
  width: 100%;
  margin-top: 14px;
  padding: 8px;
  background: #111;
  border: none;
  color: #fff;
}

button {
  margin-top: 10px;
  background: none;
  border: 1px solid #444;
  color: #aaa;
  padding: 8px;
  width: 100%;
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 0.6rem 0 calc(0.1rem + env(safe-area-inset-bottom));
  text-align: center;
  font-size: 0.6rem;
  letter-spacing: 1.5px;
  color: #11DA2D;
  opacity: 0.6;
  pointer-events: none;
}
.footer span + span::before { content: "|"; margin:0 0.4rem; }
</style>
</head>

<body>
<div class="app">

  <div class="header">202026</div>

  <div id="punishmentNote" style="
    text-align:center; 
    font-size:48px; 
    color:red; 
    font-weight:bold;
    display:none;
    animation: blink 1s infinite;
  ">!</div>
  
  
  <style>
  @keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
  }
  </style>

  <!-- DAY -->
  <div class="section">
    <div class="title">Day</div>
    <div class="bar-wrap" onclick="openTasks('day')">
      <div class="bar-fill day" id="dayBar"></div>
      <div class="pct" id="dayPct"></div>
    </div>
    <div class="meta">
      <span id="dayName"></span>
      <span id="timeNow"></span>
    </div>
  </div>

  <!-- MONTH -->
  <div class="section">
    <div class="title">Month</div>
    <div class="bar-wrap" onclick="openTasks('month')">
      <div class="bar-fill month" id="monthBar"></div>
      <div class="pct" id="monthPct"></div>
    </div>
    <div class="meta">
      <span id="monthName"></span>
      <span id="monthDay"></span>
    </div>
  </div>

  <!-- YEAR -->
  <div class="section">
    <div class="title">Year</div>
    <div class="bar-wrap" onclick="openTasks('year')">
      <div class="bar-fill year" id="yearBar"></div>
      <div class="pct" id="yearPct"></div>
    </div>
    <div class="meta">
      <span id="yearNum"></span>
      <span></span>
    </div>
  </div>

  <!-- LIFE -->
  <div class="section">
    <div class="title">Life</div>
    <div class="bar-wrap" onclick="openTasks('life')">
      <div class="bar-fill life" id="lifeBar"></div>
      <div class="pct" id="lifePct"></div>
    </div>
    <div class="meta">
      <span id="ageExact"></span>
      <span></span>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 id="modalTitle"></h2>
    <div id="taskList"></div>
    <input id="newTask" placeholder="...">
    <button onclick="addTask()">Add</button>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<footer class="footer">
  <span>GPT-5.2</span>
  <span>Git</span>
  <span>Droam</span>
</footer>

<script>
/* ---------------- TIME ---------------- */
const BIRTHDATE = new Date("2006-06-19");
const LIFE_EXPECTANCY_YEARS = 80;

function setBar(id, value){
  const pct = Math.min(Math.max(value,0),100);
  document.getElementById(id+"Bar").style.width = pct+"%";
  document.getElementById(id+"Pct").style.left = pct+"%";
  document.getElementById(id+"Pct").textContent = "";
}



function updateTime(){
  const now = new Date();
  let dayStart = new Date(now);
  let dayEnd = new Date(now);

  dayStart.setHours(5,0,0,0);
  dayEnd.setHours(5,0,0,0);

  if(now < dayStart){
    // before 5AM → day started yesterday
    dayStart.setDate(dayStart.getDate() - 1);
  } else {
    // after 5AM → day ends tomorrow
    dayEnd.setDate(dayEnd.getDate() + 1);
  }

  const dayProgress = (now - dayStart) / (dayEnd - dayStart) * 100; // convert to percent
  setBar("day", Math.min(Math.max(dayProgress, 0), 100));

  const sm=new Date(now.getFullYear(),now.getMonth(),1);
  const em=new Date(now.getFullYear(),now.getMonth()+1,1);
  setBar("month",(now-sm)/(em-sm)*100);

  const sy=new Date(now.getFullYear(),0,1);
  const ey=new Date(now.getFullYear()+1,0,1);
  setBar("year",(now-sy)/(ey-sy)*100);

  const lifeMs=LIFE_EXPECTANCY_YEARS*365.2422*86400000;
  setBar("life",(now-BIRTHDATE)/lifeMs*100);

  document.getElementById("dayName").textContent=now.toLocaleDateString(undefined,{weekday:"long"});
  document.getElementById("timeNow").textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  document.getElementById("monthName").textContent=now.toLocaleDateString(undefined,{month:"long"});
  document.getElementById("monthDay").textContent=now.getDate();
  document.getElementById("yearNum").textContent=now.getFullYear();
  document.getElementById("ageExact").textContent=getExactAge(BIRTHDATE,now);

  const note = document.getElementById("punishmentNote");
  if(localStorage.getItem("punishment_today") === "true"){
    note.style.display = "block";
  } else {
    note.style.display = "none";
  }
}

function getExactAge(birth,now){
  let y=now.getFullYear()-birth.getFullYear();
  let m=now.getMonth()-birth.getMonth();
  let d=now.getDate()-birth.getDate();
  if(d<0){ m--; d+=new Date(now.getFullYear(),now.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  return `${y}Y ${m}M ${d}D`;
}

/* ---------------- TASK SYSTEM ---------------- */
let currentType=null;
function getTasks(type){ return JSON.parse(localStorage.getItem(type+"_tasks")||"[]"); }
function saveTasks(type,tasks){ localStorage.setItem(type+"_tasks",JSON.stringify(tasks)); }

(function dailyReset(){
  const now = new Date();

  // Determine current "day" based on 5 AM
  let dayStart = new Date(now);
  dayStart.setHours(5,0,0,0);
  if(now < dayStart) dayStart.setDate(dayStart.getDate() - 1);

  const todayStr = dayStart.toDateString();
  const last = localStorage.getItem("day_last");

  if(last !== todayStr){
    const tasks = getTasks("day");
    const failed = tasks.some(t => !t.done);

    // Set punishment flag if yesterday failed
    localStorage.setItem("punishment_today", failed ? "true" : "false");

    // Reset daily tasks
    const resetTasks = tasks.map(t => ({...t, done:false}));
    saveTasks("day", resetTasks);

    localStorage.setItem("day_last", todayStr);
  }
})();

function openTasks(type){
  currentType=type;
  document.getElementById("modalTitle").textContent=type;
  document.getElementById("modal").style.display="flex";
  renderTasks();
}

function closeModal(){ document.getElementById("modal").style.display="none"; }

function renderTasks(){
  const list=document.getElementById("taskList");
  list.innerHTML="";
  getTasks(currentType).forEach((task,i)=>{
    const div=document.createElement("div");
    div.className="task"+(task.done?" done":"");
    div.innerHTML=`${task.text}<span class="task-actions" onclick="deleteTask(${i})">✕</span>`;
    div.onclick=()=>toggleTask(i);
    list.appendChild(div);
  });
}

function addTask(){
  const input=document.getElementById("newTask");
  if(!input.value.trim()) return;
  const tasks=getTasks(currentType);
  tasks.push({text:input.value,done:false});
  saveTasks(currentType,tasks);
  input.value="";
  renderTasks();
}

function toggleTask(i){
  const tasks=getTasks(currentType);
  tasks[i].done=!tasks[i].done;
  saveTasks(currentType,tasks);
  renderTasks();
}

function deleteTask(i){
  const tasks=getTasks(currentType);
  tasks.splice(i,1);
  saveTasks(currentType,tasks);
  renderTasks();
}

/* INIT */
updateTime();
setInterval(updateTime,60000);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('Service Worker registered.', reg))
      .catch(err => console.log('Service Worker failed:', err));
  });
}
</script>
</body>
</html>
